[project]
name = "bondi-benchmarks"
authors = [{ name = "Thomas Rueckstiess", email = "thomas@relcon.ai" }]
version = "0.1.0"
description = "Run native database benchmarks against BONDI targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bondi>=0.4.0,<0.5", "yanex>=0.7,<1"]

[project.optional-dependencies]
couchbase = ["bondi[couchbase]>=0.4.0,<0.5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bondi_benchmarks"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
docs = ["relcon-docs>=0.1.7,<1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
