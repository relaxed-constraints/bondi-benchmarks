# Project-owned settings override the shared relcon-docs defaults.
INHERIT: .relcon-docs/base.yml
site_name: BONDI Empty Project
site_description: A starter for reproducible database research with BONDI and Yanex
site_url: https://relaxed-constraints.github.io/bondi-empty-project/
repo_url: https://github.com/relaxed-constraints/bondi-empty-project
repo_name: relaxed-constraints/bondi-empty-project
copyright: Copyright &copy; 2026 Relaxed Constraints
nav:
- Home: index.md
- Getting started:
  - Installation: installation.md
  - Renaming the project: renaming.md
  - Git and GitHub workflow: git-workflow.md
  - Adding functionality: adding-functionality.md
  - Documentation changes: documentation.md
  - Progress updates: progress-updates.md
- User guide: user-guide.md
- API Reference: api-reference.md
- Progress:
  - Overview: progress/index.md
  - Presentation template: progress/template/presentation.md
  - Week 1: progress/week-1/presentation.md
plugins:
  mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          show_root_heading: true
          heading_level: 2
