# Project-owned settings override the shared relcon-docs defaults.
INHERIT: .relcon-docs/base.yml
site_name: BONDI Benchmarks
site_description: Native database benchmarks with BONDI and Yanex
site_url: https://relaxed-constraints.github.io/bondi-benchmarks/
repo_url: https://github.com/relaxed-constraints/bondi-benchmarks
repo_name: relaxed-constraints/bondi-benchmarks
copyright: Copyright &copy; 2026 Relaxed Constraints
nav:
- Home: index.md
- Installation: installation.md
- Benchmarks:
  - YCSB:
    - Python guide: benchmarks/ycsb/python.md
    - Yanex experiment: benchmarks/ycsb/experiments.md
    - Results: benchmarks/ycsb/results.md
- API Reference:
  - YCSB: api/ycsb.md
- Development:
  - Contributor guide: development.md
plugins:
  mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          show_root_heading: true
          heading_level: 2
