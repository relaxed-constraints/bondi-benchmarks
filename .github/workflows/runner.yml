name: Publish YCSB runner
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select image reference
        id: image
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "Git tag $GITHUB_REF_NAME must match package version $version" >&2
              exit 1
            fi
            tag="$version"
          else
            tag="sha-$GITHUB_SHA"
          fi
          repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/$repository/ycsb:$tag" >> "$GITHUB_OUTPUT"

      - name: Publish Linux amd64 and arm64 image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build runner \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE" --push --metadata-file "$RUNNER_TEMP/image.json"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")
          echo "Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
